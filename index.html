<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maison de Parfum - Sales Management System</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              DEFAULT: '#D4AF37',
              dark: '#b3922c',
              light: '#f3e5ab'
            }
          },
          fontFamily: {
            serif: ['Georgia', 'serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-black text-white min-h-screen font-sans selection:bg-gold selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, createContext, useContext } = React;

    // --- INITIAL DATA ---
    const INITIAL_PRODUCTS = [
      { id: 'p1', name: 'Oud Wood Intense', brand: 'Tom Ford', size: '100ml', category: 'oud', price: 280, cost: 140, stock: 12 },
      { id: 'p2', name: 'Baccarat Rouge 540', brand: 'Maison Francis Kurkdjian', size: '70ml', category: 'unisex', price: 320, cost: 160, stock: 3 },
      { id: 'p3', name: 'Sauvage Elixir', brand: 'Dior', size: '60ml', category: "men's", price: 180, cost: 90, stock: 15 },
      { id: 'p4', name: 'Libre Eau de Parfum', brand: 'Yves Saint Laurent', size: '90ml', category: "women's", price: 155, cost: 75, stock: 20 },
      { id: 'p5', name: 'Royal Amber Gift Set', brand: 'Orientica', size: '100ml', category: 'gift set', price: 120, cost: 50, stock: 6 }
    ];

    const INITIAL_USERS = [
      { name: 'Store Admin', email: 'admin@perfume.com', password: 'admin123', role: 'Admin' },
      { name: 'Counter Staff', email: 'staff@perfume.com', password: 'staff123', role: 'Staff' }
    ];

    // --- CONTEXTS ---
    const AuthContext = createContext();
    const AppContext = createContext();

    function AuthProvider({ children }) {
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('perfume_current_user');
        return saved ? JSON.parse(saved) : null;
      });

      const login = (email, password) => {
        const users = JSON.parse(localStorage.getItem('perfume_users') || JSON.stringify(INITIAL_USERS));
        const found = users.find(u => u.email === email && u.password === password);
        if (found) {
          const session = { name: found.name, email: found.email, role: found.role };
          setUser(session);
          localStorage.setItem('perfume_current_user', JSON.stringify(session));
          return { success: true };
        }
        return { success: false, error: 'Invalid email or password' };
      };

      const register = (name, email, password, confirmPassword, role = 'Staff') => {
        if (password !== confirmPassword) return { success: false, error: 'Passwords do not match' };
        let users = JSON.parse(localStorage.getItem('perfume_users') || JSON.stringify(INITIAL_USERS));
        if (users.some(u => u.email === email)) return { success: false, error: 'Email already registered' };
        
        const newUser = { name, email, password, role };
        users.push(newUser);
        localStorage.setItem('perfume_users', JSON.stringify(users));

        const session = { name, email, role };
        setUser(session);
        localStorage.setItem('perfume_current_user', JSON.stringify(session));
        return { success: true };
      };

      const logout = () => {
        setUser(null);
        localStorage.removeItem('perfume_current_user');
      };

      return (
        <AuthContext.Provider value={{ user, login, register, logout }}>
          {children}
        </AuthContext.Provider>
      );
    }
    const useAuth = () => useContext(AuthContext);

    function AppProvider({ children }) {
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('perfume_products');
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      });

      const [sales, setSales] = useState(() => {
        const saved = localStorage.getItem('perfume_sales');
        return saved ? JSON.parse(saved) : [];
      });

      useEffect(() => { localStorage.setItem('perfume_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('perfume_sales', JSON.stringify(sales)); }, [sales]);

      const addSale = (saleData) => {
        const newSale = { id: 's_' + Date.now(), date: new Date().toISOString(), ...saleData };
        setProducts(prev => prev.map(p => {
          if (p.id === saleData.productId) {
            return { ...p, stock: Math.max(0, p.stock - saleData.quantity) };
          }
          return p;
        }));
        setSales(prev => [newSale, ...prev]);
      };

      const deleteSale = (saleId) => {
        setSales(prev => prev.filter(s => s.id !== saleId));
      };

      const saveProduct = (product) => {
        if (product.id) {
          setProducts(prev => prev.map(p => p.id === product.id ? product : p));
        } else {
          setProducts(prev => [...prev, { ...product, id: 'p_' + Date.now() }]);
        }
      };

      const deleteProduct = (id) => {
        setProducts(prev => prev.filter(p => p.id !== id));
      };

      return (
        <AppContext.Provider value={{ products, sales, addSale, deleteSale, saveProduct, deleteProduct }}>
          {children}
        </AppContext.Provider>
      );
    }
    const useApp = () => useContext(AppContext);

    // --- COMPONENTS ---

    // 1. Splash Screen
    function SplashScreen({ onFinish }) {
      useEffect(() => {
        const t = setTimeout(onFinish, 2200);
        return () => clearTimeout(t);
      }, [onFinish]);

      return (
        <div className="fixed inset-0 bg-[#0A0A0A] flex flex-col items-center justify-center z-50">
          <div className="text-center animate-pulse">
            <img 
              src="images/splash-logo.png" 
              alt="Logo" 
              className="w-32 h-32 object-contain mx-auto mb-6 rounded-full border border-gold/40 shadow-2xl bg-neutral-900 p-2"
              onError={(e)=>{e.target.src='https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=200';}}
            />
            <h1 className="text-2xl font-serif tracking-widest text-gold">MAISON DE PARFUM</h1>
            <p className="text-xs text-neutral-400 mt-2 tracking-wider">EXQUISITE SALES MANAGEMENT</p>
          </div>
        </div>
      );
    }

    // 2. Login / Register with Video Hero
    function Login() {
      const [isReg, setIsReg] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [confirm, setConfirm] = useState('');
      const [name, setName] = useState('');
      const [role, setRole] = useState('Staff');
      const [error, setError] = useState('');
      const { login, register } = useAuth();

      const handleSubmit = (e) => {
        e.preventDefault();
        setError('');
        if (isReg) {
          const res = register(name, email, password, confirm, role);
          if (!res.success) setError(res.error);
        } else {
          const res = login(email, password);
          if (!res.success) setError(res.error);
        }
      };

      return (
        <div className="relative min-h-screen flex items-center justify-center overflow-hidden bg-black px-4">
          <video
            autoPlay
            loop
            muted
            playsInline
            className="absolute inset-0 w-full h-full object-cover opacity-35 filter brightness-75"
            onError={(e)=>{e.target.style.display='none';}}
          >
            <source src="images/login-hero.mp4" type="video/mp4" />
          </video>
          <div className="absolute inset-0 bg-gradient-to-t from-black via-black/70 to-black/30"></div>

          <div className="relative z-10 w-full max-w-md p-8 bg-neutral-900/90 backdrop-blur-md border border-neutral-800 rounded-2xl shadow-2xl">
            <div className="text-center mb-6">
              <img 
                src="images/splash-logo.png" 
                alt="Logo" 
                className="w-14 h-14 mx-auto mb-3 rounded-full border border-gold/40 bg-neutral-900 p-1"
                onError={(e)=>{e.target.src='https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=200';}}
              />
              <h2 className="text-xl font-serif text-gold">Maison de Parfum</h2>
              <p className="text-xs text-neutral-400 mt-1">{isReg ? 'Create Account' : 'Sign in to POS Terminal'}</p>
            </div>

            {error && <div className="mb-4 p-3 bg-red-950 border border-red-800 text-red-200 text-xs rounded-lg text-center">{error}</div>}

            <form onSubmit={handleSubmit} className="space-y-3">
              {isReg && (
                <div>
                  <label className="block text-xs text-neutral-400 mb-1">Full Name</label>
                  <input type="text" required value={name} onChange={e=>setName(e.target.value)} className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm focus:outline-none focus:border-gold" />
                </div>
              )}
              <div>
                <label className="block text-xs text-neutral-400 mb-1">Email Address</label>
                <input type="email" required value={email} onChange={e=>setEmail(e.target.value)} placeholder="staff@perfume.com" className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm focus:outline-none focus:border-gold" />
              </div>
              <div>
                <label className="block text-xs text-neutral-400 mb-1">Password</label>
                <input type="password" required value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm focus:outline-none focus:border-gold" />
              </div>
              {isReg && (
                <>
                  <div>
                    <label className="block text-xs text-neutral-400 mb-1">Confirm Password</label>
                    <input type="password" required value={confirm} onChange={e=>setConfirm(e.target.value)} placeholder="••••••••" className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm focus:outline-none focus:border-gold" />
                  </div>
                  <div>
                    <label className="block text-xs text-neutral-400 mb-1">Role</label>
                    <select value={role} onChange={e=>setRole(e.target.value)} className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm focus:outline-none focus:border-gold">
                      <option value="Staff">Staff</option>
                      <option value="Admin">Admin</option>
                    </select>
                  </div>
                </>
              )}
              <button type="submit" className="w-full py-2.5 bg-gold hover:bg-gold-dark text-black font-semibold rounded-lg text-sm transition-all mt-4">
                {isReg ? 'Register' : 'Sign In'}
              </button>
            </form>

            <div className="text-center mt-4">
              <button onClick={()=>setIsReg(!isReg)} className="text-xs text-gold hover:underline">
                {isReg ? 'Already have an account? Sign In' : "Don't have an account? Register"}
              </button>
            </div>
            
            <div className="mt-4 pt-3 border-t border-neutral-800 text-center text-[10px] text-neutral-500">
              Demo Admin: admin@perfume.com / admin123
            </div>
          </div>
        </div>
      );
    }

    // 3. Navigation Bar
    function Navbar({ activeTab, setActiveTab }) {
      const { user, logout } = useAuth();

      return (
        <header className="bg-neutral-900 border-b border-neutral-800 sticky top-0 z-40">
          <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center space-x-3">
              <img 
                src="images/splash-logo.png" 
                alt="Logo" 
                className="w-8 h-8 rounded-full border border-gold/40 bg-neutral-900"
                onError={(e)=>{e.target.style.display='none';}}
              />
              <span className="font-serif text-gold font-semibold tracking-wider">MAISON DE PARFUM</span>
            </div>

            <nav className="flex items-center space-x-1 sm:space-x-2 overflow-x-auto py-1">
              <button onClick={()=>setActiveTab('pos')} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${activeTab==='pos'?'bg-gold text-black':'text-neutral-300 hover:bg-neutral-800'}`}>New Sale (POS)</button>
              <button onClick={()=>setActiveTab('history')} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${activeTab==='history'?'bg-gold text-black':'text-neutral-300 hover:bg-neutral-800'}`}>Sales History</button>
              <button onClick={()=>setActiveTab('inventory')} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${activeTab==='inventory'?'bg-gold text-black':'text-neutral-300 hover:bg-neutral-800'}`}>Inventory</button>
              {user?.role === 'Admin' && (
                <button onClick={()=>setActiveTab('reports')} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${activeTab==='reports'?'bg-gold text-black':'text-neutral-300 hover:bg-neutral-800'}`}>Reports & Analytics</button>
              )}
            </nav>

            <div className="flex items-center space-x-3">
              <div className="text-right hidden sm:block">
                <p className="text-xs text-white font-medium">{user?.name}</p>
                <p className="text-[10px] text-gold uppercase">{user?.role}</p>
              </div>
              <button onClick={logout} className="px-3 py-1.5 bg-neutral-800 hover:bg-neutral-700 text-xs text-red-300 rounded-lg transition-all">Logout</button>
            </div>
          </div>
        </header>
      );
    }

    // 4. POS Terminal View
    function POSView() {
      const { products, addSale } = useApp();
      const { user } = useAuth();
      const [prodId, setProdId] = useState('');
      const [qty, setQty] = useState(1);
      const [disc, setDisc] = useState(0);
      const [method, setMethod] = useState('Card');
      const [custName, setCustName] = useState('');
      const [custPhone, setCustPhone] = useState('');
      const [notes, setNotes] = useState('');
      const [success, setSuccess] = useState(false);

      const prod = products.find(p => p.id === prodId);
      const unitPrice = prod ? prod.price : 0;
      const unitCost = prod ? prod.cost : 0;
      const totalAmt = Math.max(0, (unitPrice * qty) - Number(disc));
      const totalCost = unitCost * qty;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!prod) return;
        if (prod.stock < qty) {
          alert('Insufficient stock available!');
          return;
        }

        addSale({
          productId: prod.id,
          productName: prod.name,
          brand: prod.brand,
          size: prod.size,
          category: prod.category,
          quantity: Number(qty),
          unitPrice,
          discount: Number(disc),
          totalAmount: totalAmt,
          costPrice: totalCost,
          paymentMethod: method,
          customerName: custName || 'Walk-in Client',
          customerPhone: custPhone || '-',
          salesperson: user?.name || 'Staff',
          notes
        });

        setSuccess(true);
        setTimeout(() => setSuccess(false), 3000);
        setProdId(''); setQty(1); setDisc(0); setCustName(''); setCustPhone(''); setNotes('');
      };

      return (
        <div className="max-w-4xl mx-auto p-4 sm:p-6 bg-neutral-900 border border-neutral-800 rounded-2xl shadow-xl my-6">
          <div className="mb-6 pb-4 border-b border-neutral-800">
            <h2 className="text-xl font-serif text-gold">Point of Sale Terminal</h2>
            <p className="text-xs text-neutral-400">Log perfume transactions & auto-update inventory</p>
          </div>

          {success && (
            <div className="mb-6 p-3 bg-emerald-950 border border-emerald-700 text-emerald-200 text-xs rounded-lg">
              Sale completed successfully! Inventory updated.
            </div>
          )}

          <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="space-y-4">
              <div>
                <label className="block text-xs text-neutral-400 mb-1">Select Fragrance *</label>
                <select required value={prodId} onChange={e=>setProdId(e.target.value)} className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm focus:outline-none focus:border-gold">
                  <option value="">-- Choose Product --</option>
                  {products.map(p => (
                    <option key={p.id} value={p.id}>
                      {p.brand} - {p.name} ({p.size}) | Stock: {p.stock} | ${p.price}
                    </option>
                  ))}
                </select>
              </div>

              {prod && (
                <div className="p-3 bg-neutral-800/60 rounded-lg text-xs space-y-1 border border-neutral-700">
                  <p><span className="text-neutral-400">Brand:</span> <span className="text-white font-medium">{prod.brand}</span></p>
                  <p><span className="text-neutral-400">Category:</span> <span className="text-white uppercase">{prod.category}</span></p>
                  <p><span className="text-neutral-400">Stock Available:</span> <span className={prod.stock<=3?'text-amber-400 font-bold':'text-emerald-400 font-bold'}>{prod.stock} units</span></p>
                </div>
              )}

              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs text-neutral-400 mb-1">Quantity *</label>
                  <input type="number" min="1" required value={qty} onChange={e=>setQty(e.target.value)} className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm focus:outline-none focus:border-gold" />
                </div>
                <div>
                  <label className="block text-xs text-neutral-400 mb-1">Discount ($)</label>
                  <input type="number" min="0" value={disc} onChange={e=>setDisc(e.target.value)} className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm focus:outline-none focus:border-gold" />
                </div>
              </div>

              <div>
                <label className="block text-xs text-neutral-400 mb-1">Payment Method</label>
                <select value={method} onChange={e=>setMethod(e.target.value)} className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm focus:outline-none focus:border-gold">
                  <option value="Card">Card</option>
                  <option value="Cash">Cash</option>
                  <option value="Mobile Money">Mobile Money</option>
                  <option value="Bank Transfer">Bank Transfer</option>
                </select>
              </div>
            </div>

            <div className="space-y-4 flex flex-col justify-between">
              <div className="space-y-4">
                <div>
                  <label className="block text-xs text-neutral-400 mb-1">Customer Name (Optional)</label>
                  <input type="text" value={custName} onChange={e=>setCustName(e.target.value)} placeholder="Client Name" className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm focus:outline-none focus:border-gold" />
                </div>
                <div>
                  <label className="block text-xs text-neutral-400 mb-1">Customer Phone (Optional)</label>
                  <input type="text" value={custPhone} onChange={e=>setCustPhone(e.target.value)} placeholder="+1..." className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm focus:outline-none focus:border-gold" />
                </div>
                <div>
                  <label className="block text-xs text-neutral-400 mb-1">Notes</label>
                  <textarea value={notes} onChange={e=>setNotes(e.target.value)} rows="2" placeholder="Gift wrapping requested..." className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm focus:outline-none focus:border-gold"></textarea>
                </div>
              </div>

              <div className="p-4 bg-black/40 border border-gold/30 rounded-xl space-y-2">
                <div className="flex justify-between text-sm">
                  <span className="text-neutral-400">Unit Price:</span>
                  <span>${unitPrice.toFixed(2)}</span>
                </div>
                <div className="flex justify-between text-sm">
                  <span className="text-neutral-400">Discount:</span>
                  <span className="text-amber-400">-${Number(disc).toFixed(2)}</span>
                </div>
                <div className="flex justify-between text-base font-semibold pt-2 border-t border-neutral-800">
                  <span className="text-gold">Total Amount:</span>
                  <span className="text-gold">${totalAmt.toFixed(2)}</span>
                </div>
                <button type="submit" disabled={!prod} className="w-full mt-3 py-3 bg-gold hover:bg-gold-dark disabled:opacity-50 text-black font-semibold rounded-lg text-sm transition-all">
                  Complete Sale (${totalAmt.toFixed(2)})
                </button>
              </div>
            </div>
          </form>
        </div>
      );
    }

    // 5. Sales History View
    function HistoryView() {
      const { sales, deleteSale } = useApp();
      const { user } = useAuth();
      const [search, setSearch] = useState('');
      const [payFilter, setPayFilter] = useState('');

      const filtered = sales.filter(s => {
        const matchSearch = s.productName.toLowerCase().includes(search.toLowerCase()) || 
                            s.brand.toLowerCase().includes(search.toLowerCase()) || 
                            s.customerName.toLowerCase().includes(search.toLowerCase()) ||
                            s.salesperson.toLowerCase().includes(search.toLowerCase());
        const matchPay = payFilter ? s.paymentMethod === payFilter : true;
        return matchSearch && matchPay;
      });

      return (
        <div className="max-w-7xl mx-auto p-4 sm:p-6 my-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
            <div>
              <h2 className="text-xl font-serif text-gold">Sales History</h2>
              <p className="text-xs text-neutral-400">Search and review recorded transactions</p>
            </div>
            <div className="flex gap-2 w-full sm:w-auto">
              <input type="text" placeholder="Search product, brand, client..." value={search} onChange={e=>setSearch(e.target.value)} className="px-3 py-1.5 bg-neutral-900 border border-neutral-800 rounded-lg text-xs w-full sm:w-64 focus:outline-none focus:border-gold" />
              <select value={payFilter} onChange={e=>setPayFilter(e.target.value)} className="px-3 py-1.5 bg-neutral-900 border border-neutral-800 rounded-lg text-xs focus:outline-none focus:border-gold">
                <option value="">All Payment Types</option>
                <option value="Card">Card</option>
                <option value="Cash">Cash</option>
                <option value="Mobile Money">Mobile Money</option>
                <option value="Bank Transfer">Bank Transfer</option>
              </select>
            </div>
          </div>

          <div className="bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden shadow-xl">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-neutral-950 text-neutral-400 uppercase tracking-wider border-b border-neutral-800">
                  <tr>
                    <th className="p-3">Date</th>
                    <th className="p-3">Product</th>
                    <th className="p-3">Qty</th>
                    <th className="p-3">Total</th>
                    <th className="p-3">Payment</th>
                    <th className="p-3">Client</th>
                    <th className="p-3">Staff</th>
                    {user?.role === 'Admin' && <th className="p-3 text-right">Action</th>}
                  </tr>
                </thead>
                <tbody className="divide-y divide-neutral-800">
                  {filtered.length === 0 ? (
                    <tr><td colSpan="8" className="p-6 text-center text-neutral-500">No sales records found.</td></tr>
                  ) : (
                    filtered.map(s => (
                      <tr key={s.id} className="hover:bg-neutral-800/40">
                        <td className="p-3 text-neutral-400">{new Date(s.date).toLocaleString()}</td>
                        <td className="p-3 font-medium text-white">{s.brand} - {s.productName} <span className="text-neutral-500">({s.size})</span></td>
                        <td className="p-3">{s.quantity}</td>
                        <td className="p-3 text-gold font-semibold">${s.totalAmount.toFixed(2)}</td>
                        <td className="p-3"><span className="px-2 py-0.5 bg-neutral-800 rounded text-[10px]">{s.paymentMethod}</span></td>
                        <td className="p-3 text-neutral-300">{s.customerName}</td>
                        <td className="p-3 text-neutral-400">{s.salesperson}</td>
                        {user?.role === 'Admin' && (
                          <td className="p-3 text-right">
                            <button onClick={()=>deleteSale(s.id)} className="text-red-400 hover:text-red-300 text-[11px]">Delete</button>
                          </td>
                        )}
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // 6. Inventory View
    function InventoryView() {
      const { products, saveProduct, deleteProduct } = useApp();
      const { user } = useAuth();
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState({ name: '', brand: '', size: '100ml', category: "men's", price: '', cost: '', stock: '' });

      const handleOpenAdd = () => {
        setEditing('new');
        setForm({ name: '', brand: '', size: '100ml', category: "men's", price: '', cost: '', stock: '' });
      };

      const handleOpenEdit = (p) => {
        setEditing(p.id);
        setForm(p);
      };

      const handleSave = (e) => {
        e.preventDefault();
        saveProduct({
          ...form,
          price: Number(form.price),
          cost: Number(form.cost),
          stock: Number(form.stock)
        });
        setEditing(null);
      };

      return (
        <div className="max-w-7xl mx-auto p-4 sm:p-6 my-6">
          <div className="flex justify-between items-center mb-6">
            <div>
              <h2 className="text-xl font-serif text-gold">Inventory & Catalog</h2>
              <p className="text-xs text-neutral-400">Manage stock levels and perfume items</p>
            </div>
            {user?.role === 'Admin' && (
              <button onClick={handleOpenAdd} className="px-4 py-2 bg-gold hover:bg-gold-dark text-black text-xs font-semibold rounded-lg">
                + Add New Perfume
              </button>
            )}
          </div>

          {editing && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
              <div className="bg-neutral-900 border border-neutral-800 p-6 rounded-2xl max-w-md w-full">
                <h3 className="text-lg font-serif text-gold mb-4">{editing === 'new' ? 'Add Perfume' : 'Edit Perfume'}</h3>
                <form onSubmit={handleSave} className="space-y-3">
                  <div>
                    <label className="block text-xs text-neutral-400 mb-1">Product Name</label>
                    <input type="text" required value={form.name} onChange={e=>setForm({...form, name: e.target.value})} className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-neutral-400 mb-1">Brand</label>
                      <input type="text" required value={form.brand} onChange={e=>setForm({...form, brand: e.target.value})} className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs text-neutral-400 mb-1">Bottle Size</label>
                      <input type="text" required value={form.size} onChange={e=>setForm({...form, size: e.target.value})} className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-neutral-400 mb-1">Category</label>
                      <select value={form.category} onChange={e=>setForm({...form, category: e.target.value})} className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm">
                        <option value="men's">Men's</option>
                        <option value="women's">Women's</option>
                        <option value="unisex">Unisex</option>
                        <option value="oud">Oud</option>
                        <option value="gift set">Gift Set</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs text-neutral-400 mb-1">Stock Level</label>
                      <input type="number" required min="0" value={form.stock} onChange={e=>setForm({...form, stock: e.target.value})} className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-neutral-400 mb-1">Selling Price ($)</label>
                      <input type="number" required min="0" step="0.01" value={form.price} onChange={e=>setForm({...form, price: e.target.value})} className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs text-neutral-400 mb-1">Cost Price ($)</label>
                      <input type="number" required min="0" step="0.01" value={form.cost} onChange={e=>setForm({...form, cost: e.target.value})} className="w-full px-3 py-2 bg-neutral-800 border border-neutral-700 rounded-lg text-sm" />
                    </div>
                  </div>
                  <div className="flex justify-end space-x-2 pt-3">
                    <button type="button" onClick={()=>setEditing(null)} className="px-4 py-2 bg-neutral-800 text-xs rounded-lg">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-gold text-black font-semibold text-xs rounded-lg">Save Product</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <div className="bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden shadow-xl">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-neutral-950 text-neutral-400 uppercase tracking-wider border-b border-neutral-800">
                  <tr>
                    <th className="p-3">Brand & Name</th>
                    <th className="p-3">Category</th>
                    <th className="p-3">Size</th>
                    <th className="p-3">Price</th>
                    <th className="p-3">Cost</th>
                    <th className="p-3">Stock Level</th>
                    {user?.role === 'Admin' && <th className="p-3 text-right">Actions</th>}
                  </tr>
                </thead>
                <tbody className="divide-y divide-neutral-800">
                  {products.map(p => (
                    <tr key={p.id} className="hover:bg-neutral-800/40">
                      <td className="p-3 font-medium text-white">{p.brand} <span className="text-neutral-400 font-normal">— {p.name}</span></td>
                      <td className="p-3 uppercase text-neutral-300">{p.category}</td>
                      <td className="p-3 text-neutral-400">{p.size}</td>
                      <td className="p-3 text-gold font-semibold">${p.price.toFixed(2)}</td>
                      <td className="p-3 text-neutral-400">${p.cost.toFixed(2)}</td>
                      <td className="p-3">
                        <span className={`px-2 py-0.5 rounded text-[11px] font-bold ${p.stock <= 3 ? 'bg-amber-950 text-amber-300 border border-amber-800' : 'bg-emerald-950 text-emerald-300 border border-emerald-800'}`}>
                          {p.stock} units {p.stock <= 3 && '⚠️ Low'}
                        </span>
                      </td>
                      {user?.role === 'Admin' && (
                        <td className="p-3 text-right space-x-2">
                          <button onClick={()=>handleOpenEdit(p)} className="text-gold hover:underline">Edit</button>
                          <button onClick={()=>deleteProduct(p.id)} className="text-red-400 hover:underline">Delete</button>
                        </td>
                      )}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // 7. Reports & Analytics View (Admin Only)
    function ReportsView() {
      const { sales, products } = useApp();

      const totalSalesAmt = sales.reduce((acc, s) => acc + s.totalAmount, 0);
      const totalProfit = sales.reduce((acc, s) => acc + (s.totalAmount - s.costPrice), 0);

      const lowStockCount = products.filter(p => p.stock <= 3).length;

      return (
        <div className="max-w-7xl mx-auto p-4 sm:p-6 my-6 space-y-6">
          <div>
            <h2 className="text-xl font-serif text-gold">Performance Reports</h2>
            <p className="text-xs text-neutral-400">Overview of boutique sales and profitability</p>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div className="p-5 bg-neutral-900 border border-neutral-800 rounded-2xl">
              <p className="text-xs text-neutral-400 mb-1">Total Gross Revenue</p>
              <p className="text-2xl font-serif text-gold">${totalSalesAmt.toFixed(2)}</p>
            </div>
            <div className="p-5 bg-neutral-900 border border-neutral-800 rounded-2xl">
              <p className="text-xs text-neutral-400 mb-1">Total Net Profit</p>
              <p className="text-2xl font-serif text-emerald-400">${totalProfit.toFixed(2)}</p>
            </div>
            <div className="p-5 bg-neutral-900 border border-neutral-800 rounded-2xl">
              <p className="text-xs text-neutral-400 mb-1">Low Stock Alerts</p>
              <p className="text-2xl font-serif text-amber-400">{lowStockCount} items</p>
            </div>
          </div>

          <div className="p-6 bg-neutral-900 border border-neutral-800 rounded-2xl">
            <h3 className="text-sm font-serif text-gold mb-4">Low Stock Warning Report</h3>
            {products.filter(p => p.stock <= 3).length === 0 ? (
              <p className="text-xs text-neutral-400">All products have sufficient stock levels.</p>
            ) : (
              <div className="space-y-2">
                {products.filter(p => p.stock <= 3).map(p => (
                  <div key={p.id} className="flex justify-between items-center p-3 bg-neutral-950 border border-amber-900/40 rounded-xl text-xs">
                    <div>
                      <span className="font-medium text-white">{p.brand} - {p.name}</span>
                      <span className="text-neutral-400 ml-2">({p.size})</span>
                    </div>
                    <span className="text-amber-400 font-bold">{p.stock} units remaining</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- MAIN APP CONTROLLER ---
    function AppContent() {
      const { user } = useAuth();
      const [showSplash, setShowSplash] = useState(true);
      const [activeTab, setActiveTab] = useState('pos');

      if (showSplash) {
        return <SplashScreen onFinish={() => setShowSplash(false)} />;
      }

      if (!user) {
        return <Login />;
      }

      return (
        <div className="min-h-screen bg-black text-white flex flex-col">
          <Navbar activeTab={activeTab} setActiveTab={setActiveTab} />
          <main className="flex-1">
            {activeTab === 'pos' && <POSView />}
            {activeTab === 'history' && <HistoryView />}
            {activeTab === 'inventory' && <InventoryView />}
            {activeTab === 'reports' && user.role === 'Admin' && <ReportsView />}
          </main>
        </div>
      );
    }

    function App() {
      return (
        <AuthProvider>
          <AppProvider>
            <AppContent />
          </AppProvider>
        </AuthProvider>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
