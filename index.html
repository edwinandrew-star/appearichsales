<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfume Sales Management System</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-slide-in-right { animation: slideInRight 0.5s ease-out forwards; }
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-neutral-50 text-neutral-900 font-sans selection:bg-neutral-900 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, createElement: h } = React;
    const { createClient } = supabase;

    // Supabase Client Initialization (Fixed URL without /rest/v1/)
    const SUPABASE_URL = 'https://zudqubbglwphfxaviqsg.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Icon helper
    const Icon = ({ name, size = 20, className = "" }) => {
      useEffect(() => { lucide.createIcons(); }, [name]);
      return <i data-lucide={name} className={className} style={{ width: size, height: size, display: 'inline-block' }}></i>;
    };

    // 1. Splash Screen
    function SplashScreen({ onFinish }) {
      useEffect(() => {
        const timer = setTimeout(onFinish, 2200);
        return () => clearTimeout(timer);
      }, [onFinish]);

      return (
        <div className="fixed inset-0 bg-black z-50 flex items-center justify-center transition-opacity duration-700">
          <div className="transform scale-90 animate-pulse duration-1000">
            <img src="/images/splash-logo.png" alt="Logo" className="w-48 h-auto object-contain drop-shadow-2xl" />
          </div>
        </div>
      );
    }

    // 2. Login Page
    function Login({ onLoginSuccess, onSwitchToSignUp }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [sentenceIdx, setSentenceIdx] = useState(0);
      const sentences = [
        "Wear your presence.",
        "Every scent tells a story.",
        "Your fragrance. Your identity.",
        "Manage every sale."
      ];

      useEffect(() => {
        const interval = setInterval(() => {
          setSentenceIdx(p => (p + 1) % sentences.length);
        }, 3500);
        return () => clearInterval(interval);
      }, []);

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        setLoading(false);
        if (error) setError(error.message);
        else onLoginSuccess(data.user);
      };

      return (
        <div className="min-h-screen bg-white flex flex-col justify-between">
          <div className="w-full h-56 md:h-72 relative overflow-hidden bg-neutral-100">
            <video src="/images/login-hero.mp4" autoPlay muted loop playsInline className="w-full h-full object-cover opacity-90" />
            <div className="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-white/90" />
          </div>
          <div className="px-6 py-4 text-center h-16 flex items-center justify-center">
            <p key={sentenceIdx} className="text-lg md:text-xl font-serif tracking-wide text-neutral-800 animate-slide-in-right">
              “{sentences[sentenceIdx]}”
            </p>
          </div>
          <div className="flex-1 max-w-md w-full mx-auto px-6 pb-12 flex flex-col justify-center">
            <h2 className="text-2xl font-semibold mb-1">Welcome Back</h2>
            <p className="text-sm text-neutral-500 mb-6">Sign in to manage your daily perfume sales.</p>
            {error && <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg">{error}</div>}
            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-xs font-medium uppercase tracking-wider text-neutral-500 mb-1">Email</label>
                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder="you@shop.com" className="w-full px-4 py-3 rounded-xl border border-neutral-200 text-sm focus:ring-2 focus:ring-neutral-900 outline-none" />
              </div>
              <div>
                <label className="block text-xs font-medium uppercase tracking-wider text-neutral-500 mb-1">Password</label>
                <input type="password" required value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" className="w-full px-4 py-3 rounded-xl border border-neutral-200 text-sm focus:ring-2 focus:ring-neutral-900 outline-none" />
              </div>
              <button type="submit" disabled={loading} className="w-full py-3.5 bg-neutral-900 text-white rounded-xl font-medium text-sm shadow-md hover:bg-neutral-800 transition">
                {loading ? 'Logging in...' : 'Login'}
              </button>
            </form>
            <p className="text-sm text-neutral-600 text-center mt-8">
              Don't have an account? <button onClick={onSwitchToSignUp} className="font-medium text-neutral-900 underline">Sign Up</button>
            </p>
          </div>
        </div>
      );
    }

    // 3. Sign Up Page
    function SignUp({ onSignUpSuccess, onSwitchToLogin }) {
      const [fullName, setFullName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSignUp = async (e) => {
        e.preventDefault();
        if (password !== confirmPassword) { setError('Passwords do not match.'); return; }
        setLoading(true);
        setError('');
        const { data, error } = await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: fullName } } });
        setLoading(false);
        if (error) setError(error.message);
        else onSignUpSuccess(data.user);
      };

      return (
        <div className="min-h-screen bg-white flex flex-col justify-center px-6 py-12 max-w-md mx-auto">
          <h2 className="text-2xl font-semibold mb-1">Create Account</h2>
          <p className="text-sm text-neutral-500 mb-6">Start tracking your boutique perfume sales effortlessly.</p>
          {error && <div className="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg">{error}</div>}
          <form onSubmit={handleSignUp} className="space-y-4">
            <div>
              <label className="block text-xs font-medium uppercase tracking-wider text-neutral-500 mb-1">Full Name</label>
              <input type="text" required value={fullName} onChange={e => setFullName(e.target.value)} placeholder="Jane Doe" className="w-full px-4 py-3 rounded-xl border border-neutral-200 text-sm focus:ring-2 focus:ring-neutral-900 outline-none" />
            </div>
            <div>
              <label className="block text-xs font-medium uppercase tracking-wider text-neutral-500 mb-1">Email</label>
              <input type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder="you@shop.com" className="w-full px-4 py-3 rounded-xl border border-neutral-200 text-sm focus:ring-2 focus:ring-neutral-900 outline-none" />
            </div>
            <div>
              <label className="block text-xs font-medium uppercase tracking-wider text-neutral-500 mb-1">Password</label>
              <input type="password" required value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" className="w-full px-4 py-3 rounded-xl border border-neutral-200 text-sm focus:ring-2 focus:ring-neutral-900 outline-none" />
            </div>
            <div>
              <label className="block text-xs font-medium uppercase tracking-wider text-neutral-500 mb-1">Confirm Password</label>
              <input type="password" required value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} placeholder="••••••••" className="w-full px-4 py-3 rounded-xl border border-neutral-200 text-sm focus:ring-2 focus:ring-neutral-900 outline-none" />
            </div>
            <button type="submit" disabled={loading} className="w-full py-3.5 bg-neutral-900 text-white rounded-xl font-medium text-sm shadow-md hover:bg-neutral-800 transition">
              {loading ? 'Creating Account...' : 'Create Account'}
            </button>
          </form>
          <p className="text-sm text-neutral-600 text-center mt-8">
            Already have an account? <button onClick={onSwitchToLogin} className="font-medium text-neutral-900 underline">Login</button>
          </p>
        </div>
      );
    }

    // 4. Navigation Bar
    function Navigation({ activeTab, setActiveTab }) {
      const tabs = [
        { id: 'home', label: 'Home', icon: 'home' },
        { id: 'sales', label: 'Sales', icon: 'shopping-bag' },
        { id: 'progress', label: 'Progress', icon: 'bar-chart-2' },
        { id: 'profile', label: 'Profile', icon: 'user' },
      ];
      return (
        <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-neutral-200 py-2 px-6 flex justify-around items-center z-40 max-w-md mx-auto shadow-lg">
          {tabs.map(t => (
            <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex flex-col items-center py-1 px-3 ${activeTab === t.id ? 'text-neutral-900 font-semibold' : 'text-neutral-400'}`}>
              <Icon name={t.icon} size={20} />
              <span className="text-[11px] mt-1">{t.label}</span>
            </button>
          ))}
        </nav>
      );
    }

    // 5. Home Component
    function Home({ sales, onOpenAddSale, onViewAllSales }) {
      const todayStr = new Date().toISOString().split('T')[0];
      const todaysSales = sales.filter(s => s.date && s.date.startsWith(todayStr));
      const todaysTotal = todaysSales.reduce((acc, s) => acc + Number(s.sale_amount || 0), 0);
      const perfumesSoldToday = todaysSales.reduce((acc, s) => acc + Number(s.quantity || 0), 0);
      const cashToday = todaysSales.filter(s => s.payment_method === 'Cash').reduce((acc, s) => acc + Number(s.sale_amount || 0), 0);
      const mobileMoneyToday = todaysSales.filter(s => s.payment_method === 'Mobile Money').reduce((acc, s) => acc + Number(s.sale_amount || 0), 0);
      const deliveryTodayCount = todaysSales.filter(s => s.delivery === 'Yes').length;
      const deliveryCostToday = todaysSales.filter(s => s.delivery === 'Yes').reduce((acc, s) => acc + Number(s.delivery_cost || 0), 0);
      const recentSales = sales.slice(0, 5);

      return (
        <div className="pb-24 max-w-md mx-auto">
          <div className="w-full h-48 bg-neutral-100 overflow-hidden relative">
            <img src="/images/home-hero.png" alt="Hero" className="w-full h-full object-cover" />
            <div className="absolute inset-0 bg-gradient-to-t from-neutral-900/60 flex items-end p-5">
              <h1 className="text-white text-lg font-serif font-medium">Boutique Dashboard</h1>
            </div>
          </div>
          <div className="px-5 -mt-5 relative z-10">
            <button onClick={onOpenAddSale} className="w-full py-4 bg-neutral-900 text-white rounded-2xl font-medium shadow-xl flex items-center justify-center space-x-2">
              <Icon name="plus" size={20} /><span>+ Add Sale</span>
            </button>
          </div>
          <div className="px-5 mt-6 grid grid-cols-2 gap-3">
            <div className="bg-white p-4 rounded-2xl border border-neutral-100 shadow-xs">
              <div className="flex items-center text-neutral-400 mb-2"><Icon name="dollar-sign" size={18} /><span className="text-xs uppercase ml-1">Today's Total</span></div>
              <p className="text-xl font-bold">{todaysTotal.toLocaleString()}</p>
            </div>
            <div className="bg-white p-4 rounded-2xl border border-neutral-100 shadow-xs">
              <div className="flex items-center text-neutral-400 mb-2"><Icon name="package" size={18} /><span className="text-xs uppercase ml-1">Perfumes Sold</span></div>
              <p className="text-xl font-bold">{perfumesSoldToday}</p>
            </div>
            <div className="bg-white p-4 rounded-2xl border border-neutral-100 shadow-xs">
              <div className="flex items-center text-neutral-400 mb-2"><Icon name="dollar-sign" size={18} /><span className="text-xs uppercase ml-1">Cash Today</span></div>
              <p className="text-lg font-bold">{cashToday.toLocaleString()}</p>
            </div>
            <div className="bg-white p-4 rounded-2xl border border-neutral-100 shadow-xs">
              <div className="flex items-center text-neutral-400 mb-2"><Icon name="credit-card" size={18} /><span className="text-xs uppercase ml-1">Mobile Money</span></div>
              <p className="text-lg font-bold">{mobileMoneyToday.toLocaleString()}</p>
            </div>
          </div>
          <div className="px-5 mt-3">
            <div className="bg-neutral-50 p-4 rounded-2xl border border-neutral-100 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="p-2 bg-white rounded-xl shadow-xs"><Icon name="truck" size={18} /></div>
                <div><p className="text-xs text-neutral-500 uppercase">Delivery Today</p><p className="text-sm font-medium">{deliveryTodayCount} orders</p></div>
              </div>
              <div className="text-right"><span className="text-xs text-neutral-500">Cost:</span><p className="text-sm font-bold">{deliveryCostToday.toLocaleString()}</p></div>
            </div>
          </div>
          <div className="px-5 mt-6">
            <div className="flex justify-between items-center mb-3">
              <h3 className="text-sm font-semibold uppercase text-neutral-500">Recent Sales</h3>
              <button onClick={onViewAllSales} className="text-xs font-medium underline">View All</button>
            </div>
            {recentSales.length === 0 ? (
              <div className="bg-neutral-50 p-6 rounded-2xl text-center border border-dashed border-neutral-200"><p className="text-sm text-neutral-500">No sales recorded yet today.</p></div>
            ) : (
              <div className="space-y-2">
                {recentSales.map(s => (
                  <div key={s.id} className="bg-white p-3.5 rounded-xl border border-neutral-100 shadow-xs flex justify-between items-center">
                    <div>
                      <div className="flex items-center space-x-2"><span className="font-semibold text-sm">{s.perfume_size}</span><span className="text-xs px-2 py-0.5 bg-neutral-100 rounded-full">Qty: {s.quantity}</span></div>
                      <p className="text-xs text-neutral-400 mt-1">{s.payment_method}</p>
                    </div>
                    <div className="text-right"><p className="font-bold text-sm">{Number(s.sale_amount).toLocaleString()}</p></div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // 6. Add Sale Modal
    function AddSaleModal({ onClose, onSaveSale, initialData }) {
      const [perfumeSize, setPerfumeSize] = useState(initialData ? initialData.perfume_size : '30ml');
      const [quantity, setQuantity] = useState(initialData ? initialData.quantity : 1);
      const [saleAmount, setSaleAmount] = useState(initialData ? initialData.sale_amount : '');
      const [paymentMethod, setPaymentMethod] = useState(initialData ? initialData.payment_method : 'Cash');
      const [delivery, setDelivery] = useState(initialData ? initialData.delivery : 'No');
      const [deliveryCost, setDeliveryCost] = useState(initialData ? initialData.delivery_cost : '');
      const [customerInfo, setCustomerInfo] = useState(initialData ? initialData.customer_info : '');
      const sizes = ['10ml', '20ml', '30ml', '50ml', '100ml'];

      const handleSubmit = (e) => {
        e.preventDefault();
        onSaveSale({
          perfume_size: perfumeSize,
          quantity: Number(quantity),
          sale_amount: Number(saleAmount),
          payment_method: paymentMethod,
          delivery,
          delivery_cost: delivery === 'Yes' ? Number(deliveryCost || 0) : 0,
          customer_info: customerInfo,
          date: initialData ? initialData.date : new Date().toISOString(),
          transaction_id: initialData ? initialData.transaction_id : 'TX-' + Math.floor(100000 + Math.random() * 900000)
        }, initialData ? initialData.id : null);
      };

      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-end md:items-center justify-center p-0 md:p-4">
          <div className="bg-white w-full max-w-md rounded-t-3xl md:rounded-3xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl animate-slide-up">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-lg font-semibold">{initialData ? 'Edit Sale' : 'Record New Sale'}</h2>
              <button onClick={onClose} className="p-2 text-neutral-400"><Icon name="x" size={20} /></button>
            </div>
            <form onSubmit={handleSubmit} className="space-y-5">
              <div>
                <label className="block text-xs font-medium uppercase text-neutral-500 mb-2">Perfume Size</label>
                <div className="grid grid-cols-5 gap-2">
                  {sizes.map(sz => (
                    <button type="button" key={sz} onClick={() => setPerfumeSize(sz)} className={`py-2.5 text-xs font-medium rounded-xl border ${perfumeSize === sz ? 'bg-neutral-900 text-white border-neutral-900' : 'bg-white text-neutral-700 border-neutral-200'}`}>
                      {sz}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <label className="block text-xs font-medium uppercase text-neutral-500 mb-1">Quantity</label>
                <input type="number" min="1" required value={quantity} onChange={e => setQuantity(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-neutral-200 text-sm outline-none focus:ring-2 focus:ring-neutral-900" />
              </div>
              <div>
                <label className="block text-xs font-medium uppercase text-neutral-500 mb-1">Sale Amount / Amount Received</label>
                <input type="number" required value={saleAmount} onChange={e => setSaleAmount(e.target.value)} placeholder="e.g. 25000" className="w-full px-4 py-3 rounded-xl border border-neutral-200 text-sm outline-none focus:ring-2 focus:ring-neutral-900" />
              </div>
              <div>
                <label className="block text-xs font-medium uppercase text-neutral-500 mb-2">Payment Method</label>
                <div className="grid grid-cols-2 gap-3">
                  {['Cash', 'Mobile Money'].map(m => (
                    <button type="button" key={m} onClick={() => setPaymentMethod(m)} className={`py-3 text-xs font-medium rounded-xl border ${paymentMethod === m ? 'bg-neutral-900 text-white border-neutral-900' : 'bg-white text-neutral-700 border-neutral-200'}`}>
                      {m}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <label className="block text-xs font-medium uppercase text-neutral-500 mb-2">Delivery</label>
                <div className="grid grid-cols-2 gap-3">
                  {['Yes', 'No'].map(opt => (
                    <button type="button" key={opt} onClick={() => setDelivery(opt)} className={`py-3 text-xs font-medium rounded-xl border ${delivery === opt ? 'bg-neutral-900 text-white border-neutral-900' : 'bg-white text-neutral-700 border-neutral-200'}`}>
                      {opt}
                    </button>
                  ))}
                </div>
              </div>
              {delivery === 'Yes' && (
                <div>
                  <label className="block text-xs font-medium uppercase text-neutral-500 mb-1">Delivery Cost</label>
                  <input type="number" value={deliveryCost} onChange={e => setDeliveryCost(e.target.value)} placeholder="e.g. 5000" className="w-full px-4 py-3 rounded-xl border border-neutral-200 text-sm outline-none focus:ring-2 focus:ring-neutral-900" />
                </div>
              )}
              <div>
                <label className="block text-xs font-medium uppercase text-neutral-500 mb-1">Customer Name / Contact (Optional)</label>
                <input type="text" value={customerInfo} onChange={e => setCustomerInfo(e.target.value)} placeholder="e.g. John" className="w-full px-4 py-3 rounded-xl border border-neutral-200 text-sm outline-none focus:ring-2 focus:ring-neutral-900" />
              </div>
              <button type="submit" className="w-full py-4 bg-neutral-900 text-white rounded-xl font-medium text-sm shadow-lg mt-4">Save Sale</button>
            </form>
          </div>
        </div>
      );
    }

    // 7. Sales List Page
    function SalesPage({ sales, onOpenAddSale, onEditSale, onDeleteSale }) {
      const [search, setSearch] = useState('');
      const filtered = sales.filter(s => s.transaction_id.toLowerCase().includes(search.toLowerCase()) || (s.customer_info && s.customer_info.toLowerCase().includes(search.toLowerCase())));

      return (
        <div className="pb-24 px-5 max-w-md mx-auto pt-6">
          <div className="flex justify-between items-center mb-6">
            <div><h1 className="text-xl font-semibold">Sales History</h1><p className="text-xs text-neutral-500">Manage all transactions</p></div>
            <button onClick={onOpenAddSale} className="px-4 py-2.5 bg-neutral-900 text-white rounded-xl text-xs font-medium shadow-md flex items-center space-x-1"><Icon name="plus" size={16} /><span>+ Add Sale</span></button>
          </div>
          <div className="relative mb-5">
            <input type="text" placeholder="Search transactions..." value={search} onChange={e => setSearch(e.target.value)} className="w-full pl-4 pr-4 py-2.5 rounded-xl border border-neutral-200 text-xs outline-none bg-white" />
          </div>
          {filtered.length === 0 ? (
            <div className="bg-neutral-50 p-8 rounded-2xl text-center border border-dashed border-neutral-200"><p className="text-sm text-neutral-500">No transactions found.</p></div>
          ) : (
            <div className="space-y-3">
              {filtered.map(s => (
                <div key={s.id} className="bg-white p-4 rounded-2xl border border-neutral-100 shadow-xs">
                  <div className="flex justify-between items-start mb-2">
                    <div>
                      <div className="flex items-center space-x-2"><span className="font-bold text-sm">{s.perfume_size}</span><span className="text-xs px-2 py-0.5 bg-neutral-100 rounded-full">Qty: {s.quantity}</span></div>
                      {s.customer_info && <p className="text-xs text-neutral-500 mt-1">{s.customer_info}</p>}
                    </div>
                    <div className="text-right"><p className="font-bold text-sm">{Number(s.sale_amount).toLocaleString()}</p><p className="text-[10px] text-neutral-400">{s.payment_method}</p></div>
                  </div>
                  <div className="pt-2 border-t border-neutral-100 flex justify-between items-center text-xs text-neutral-500">
                    <span>{new Date(s.date).toLocaleDateString()}</span>
                    <div className="flex items-center space-x-3">
                      <button onClick={() => onEditSale(s)} className="text-neutral-600 hover:text-neutral-900 flex items-center space-x-1"><Icon name="edit-2" size={13} /><span>Edit</span></button>
                      <button onClick={() => onDeleteSale(s.id)} className="text-red-500 hover:text-red-700 flex items-center space-x-1"><Icon name="trash-2" size={13} /><span>Delete</span></button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // 8. Progress Page
    function ProgressPage({ sales }) {
      const [selMonth, setSelMonth] = useState(String(new Date().getMonth() + 1).padStart(2, '0'));
      const months = [{ name: 'January', val: '01' }, { name: 'February', val: '02' }, { name: 'March', val: '03' }, { name: 'April', val: '04' }, { name: 'May', val: '05' }, { name: 'June', val: '06' }, { name: 'July', val: '07' }, { name: 'August', val: '08' }, { name: 'September', val: '09' }, { name: 'October', val: '10' }, { name: 'November', val: '11' }, { name: 'December', val: '12' }];
      
      const monthSales = sales.filter(s => s.date && s.date.split('-')[1] === selMonth);
      const totalAmount = monthSales.reduce((acc, s) => acc + Number(s.sale_amount || 0), 0);
      const totalUnits = monthSales.reduce((acc, s) => acc + Number(s.quantity || 0), 0);
      const cashTotal = monthSales.filter(s => s.payment_method === 'Cash').reduce((acc, s) => acc + Number(s.sale_amount || 0), 0);
      const mmTotal = monthSales.filter(s => s.payment_method === 'Mobile Money').reduce((acc, s) => acc + Number(s.sale_amount || 0), 0);
      
      const sizes = { '10ml': 0, '20ml': 0, '30ml': 0, '50ml': 0, '100ml': 0 };
      monthSales.forEach(s => { if (sizes[s.perfume_size] !== undefined) sizes[s.perfume_size] += Number(s.quantity || 0); });

      return (
        <div className="pb-24 px-5 max-w-md mx-auto pt-6">
          <div className="mb-6"><h1 className="text-xl font-semibold">Monthly Progress</h1><p className="text-xs text-neutral-500">Review monthly data</p></div>
          <div className="mb-6">
            <select value={selMonth} onChange={e => setSelMonth(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-neutral-200 bg-white text-sm outline-none">
              {months.map(m => <option key={m.val} value={m.val}>{m.name}</option>)}
            </select>
          </div>
          <div className="grid grid-cols-2 gap-3 mb-5">
            <div className="bg-white p-4 rounded-2xl border border-neutral-100 shadow-xs"><p className="text-xs uppercase text-neutral-400 mb-1">Total Amount Sold</p><p className="text-xl font-bold">{totalAmount.toLocaleString()}</p></div>
            <div className="bg-white p-4 rounded-2xl border border-neutral-100 shadow-xs"><p className="text-xs uppercase text-neutral-400 mb-1">Total Units Sold</p><p className="text-xl font-bold">{totalUnits}</p></div>
          </div>
          <div className="bg-white p-4 rounded-2xl border border-neutral-100 shadow-xs mb-5 space-y-3">
            <h3 className="text-xs font-semibold uppercase text-neutral-500">Payment Breakdown</h3>
            <div className="flex justify-between text-sm"><span className="text-neutral-600">Cash</span><span className="font-bold">{cashTotal.toLocaleString()}</span></div>
            <div className="flex justify-between text-sm pt-2 border-t border-neutral-100"><span className="text-neutral-600">Mobile Money</span><span className="font-bold">{mmTotal.toLocaleString()}</span></div>
          </div>
          <div className="bg-white p-4 rounded-2xl border border-neutral-100 shadow-xs">
            <h3 className="text-xs font-semibold uppercase text-neutral-500 mb-3">Perfume Size Breakdown</h3>
            <div className="space-y-3">
              {Object.entries(sizes).map(([sz, qty]) => (
                <div key={sz}>
                  <div className="flex justify-between text-xs mb-1"><span className="font-medium">{sz}</span><span className="font-bold">{qty} sold</span></div>
                  <div className="w-full bg-neutral-100 h-2 rounded-full overflow-hidden"><div className="bg-neutral-900 h-full rounded-full" style={{ width: `${(qty / Math.max(...Object.values(sizes), 1)) * 100}%` }} /></div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // 9. Profile Page
    function ProfilePage({ user, onLogout }) {
      return (
        <div className="pb-24 px-5 max-w-md mx-auto pt-6">
          <div className="mb-6"><h1 className="text-xl font-semibold">Profile</h1><p className="text-xs text-neutral-500">Account settings</p></div>
          <div className="bg-white p-6 rounded-2xl border border-neutral-100 shadow-xs space-y-4 mb-6">
            <div className="flex items-center space-x-4 pb-4 border-b border-neutral-100">
              <div className="w-12 h-12 bg-neutral-900 text-white rounded-full flex items-center justify-center font-bold text-lg">{user?.email?.[0].toUpperCase()}</div>
              <div><p className="font-semibold">{user?.user_metadata?.full_name || 'Owner'}</p><p className="text-xs text-neutral-500">{user?.email}</p></div>
            </div>
          </div>
          <button onClick={onLogout} className="w-full py-3.5 bg-red-50 text-red-600 rounded-xl font-medium text-sm flex items-center justify-center space-x-2 border border-red-100">
            <Icon name="log-out" size={16} /><span>Logout</span>
          </button>
        </div>
      );
    }

    // 10. Main App Wrapper
    function App() {
      const [showSplash, setShowSplash] = useState(true);
      const [user, setUser] = useState(null);
      const [authView, setAuthView] = useState('login');
      const [activeTab, setActiveTab] = useState('home');
      const [sales, setSales] = useState([]);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [editingSale, setEditingSale] = useState(null);

      useEffect(() => {
        supabaseClient.auth.getSession().then(({ data: { session } }) => setUser(session?.user ?? null));
        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_, session) => setUser(session?.user ?? null));
        return () => subscription.unsubscribe();
      }, []);

      useEffect(() => { if (user) fetchSales(); }, [user]);

      const fetchSales = async () => {
        const { data } = await supabaseClient.from('sales').select('*').order('date', { ascending: false });
        if (data) setSales(data);
      };

      const handleSaveSale = async (saleData, id) => {
        if (id) {
          await supabaseClient.from('sales').update(saleData).eq('id', id);
          setSales(sales.map(s => s.id === id ? { ...s, ...saleData } : s));
        } else {
          const { data } = await supabaseClient.from('sales').insert([{ ...saleData, user_id: user.id }]).select();
          if (data) setSales([data[0], ...sales]);
        }
        setIsAddModalOpen(false);
        setEditingSale(null);
      };

      const handleDeleteSale = async (id) => {
        await supabaseClient.from('sales').delete().eq('id', id);
        setSales(sales.filter(s => s.id !== id));
      };

      if (showSplash) return <SplashScreen onFinish={() => setShowSplash(false)} />;
      if (!user) {
        if (authView === 'signup') return <SignUp onSignUpSuccess={u => setUser(u)} onSwitchToLogin={() => setAuthView('login')} />;
        return <Login onLoginSuccess={u => setUser(u)} onSwitchToSignUp={() => setAuthView('signup')} />;
      }

      return (
        <div className="min-h-screen bg-neutral-50 text-neutral-900 font-sans">
          {activeTab === 'home' && <Home sales={sales} onOpenAddSale={() => { setEditingSale(null); setIsAddModalOpen(true); }} onViewAllSales={() => setActiveTab('sales')} />}
          {activeTab === 'sales' && <SalesPage sales={sales} onOpenAddSale={() => { setEditingSale(null); setIsAddModalOpen(true); }} onEditSale={s => { setEditingSale(s); setIsAddModalOpen(true); }} onDeleteSale={handleDeleteSale} />}
          {activeTab === 'progress' && <ProgressPage sales={sales} />}
          {activeTab === 'profile' && <ProfilePage user={user} onLogout={() => supabaseClient.auth.signOut()} />}
          <Navigation activeTab={activeTab} setActiveTab={setActiveTab} />
          {isAddModalOpen && <AddSaleModal initialData={editingSale} onClose={() => { setIsAddModalOpen(false); setEditingSale(null); }} onSaveSale={handleSaveSale} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
